# JVM memory for the Gradle build process.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Run independent build tasks in parallel for speed.
org.gradle.parallel=true
# Enable AndroidX (the modern Android support libraries). Required.
android.useAndroidX=true
# Keep generated R (resource) classes lean per-module.
android.nonTransitiveRClass=true
# Use the official Kotlin code style.
kotlin.code.style=official
